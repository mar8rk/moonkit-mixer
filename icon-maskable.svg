<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a0038"/>
      <stop offset="100%" stop-color="#06000f"/>
    </radialGradient>
    <radialGradient id="mg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe799" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffe799" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bg2)"/>
  <!-- Content in safe zone (center 80% = 102,102 to 410,410) -->
  <circle cx="230" cy="210" r="85" fill="url(#mg2)"/>
  <!-- Stars -->
  <circle cx="370" cy="130" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="400" cy="190" r="1.8" fill="white" opacity="0.5"/>
  <circle cx="140" cy="140" r="2"   fill="white" opacity="0.7"/>
  <circle cx="120" cy="210" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="390" cy="290" r="2"   fill="white" opacity="0.5"/>
  <!-- Moon -->
  <circle cx="230" cy="210" r="82" fill="#fffde8" filter="url(#glow2)"/>
  <circle cx="266" cy="194" r="70" fill="#0d0022"/>
  <!-- Three dots -->
  <circle cx="215" cy="350" r="9" fill="#b14eff" opacity="0.7"/>
  <circle cx="252" cy="336" r="9" fill="#ff4ecb" opacity="0.7"/>
  <circle cx="289" cy="350" r="9" fill="#00e5ff" opacity="0.7"/>
</svg>
